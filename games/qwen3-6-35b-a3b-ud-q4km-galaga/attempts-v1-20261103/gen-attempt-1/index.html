<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Space Shooter</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; font-family: 'Courier New', Courier, monospace; touch-action: none; user-select: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .hud { padding: 20px; color: #fff; text-shadow: 0 0 10px #0ff; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; transition: opacity 0.3s; }
        h1 { color: #f0f; text-shadow: 0 0 20px #f0f; font-size: 40px; margin: 0 0 20px 0; text-align: center; }
        p { color: #fff; font-size: 18px; margin-bottom: 30px; text-align: center; max-width: 80%; }
        button { background: transparent; border: 2px solid #0ff; color: #0ff; padding: 15px 40px; font-size: 20px; font-family: inherit; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px #0ff; transition: 0.2s; pointer-events: auto; }
        button:hover { background: #0ff; color: #000; }
        #controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; }
        .btn { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); pointer-events: auto; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; touch-action: none; }
        .btn:active { background: rgba(0, 255, 255, 0.3); border-color: #0ff; }
        .d-pad { display: flex; gap: 10px; }
        .action-pad { display: flex; }
        #msg { color: #ff0; font-size: 14px; margin-top: 10px; }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>
    <div id="ui">
        <div class="hud">
            <span id="scoreEl">SCORE: 0</span>
            <span id="livesEl">LIVES: 3</span>
        </div>
        <div id="controls">
            <div class="d-pad">
                <div class="btn" id="btnLeft">←</div>
                <div class="btn" id="btnRight">→</div>
            </div>
            <div class="action-pad">
                <div class="btn" id="btnFire" style="border-color: #f0f; color:#f0f;">●</div>
            </div>
        </div>
    </div>
    <div id="overlay">
        <h1>NEON DEFENDER</h1>
        <p>Arrows/WASD to Move. Space to Shoot.<br>Don't let them pass!</p>
        <button id="startBtn">START MISSION</button>
        <div id="msg"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- CONFIGURATION ---
        const COLORS = {
            bg: 0x050510,
            player: 0x00ffff,
            enemy: 0xff0055,
            bullet: 0xffff00,
            star: 0xffffff
        };
        const WORLD_W = 10; // X range
        const WORLD_H = 16; // Y range
        const PLAYER_SPEED = 0.15;
        const BULLET_SPEED = 0.4;
        const FIRE_COOLDOWN = 15; // frames

        // --- STATE ---
        const state = {
            ready: false,
            score: 0,
            lives: 3,
            over: false,
            player: { x: 0, y: -6 },
            enemies: [],
            bullets: [],
            particles: [],
            wave: 1,
            frame: 0
        };

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(COLORS.bg);
        scene.fog = new THREE.FogExp2(COLORS.bg, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2, 12);
        camera.lookAt(0, -2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambient = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // --- ASSETS (Procedural) ---
        // Player Ship
        const playerGeo = new THREE.ConeGeometry(0.4, 1, 4);
        playerGeo.rotateX(Math.PI / 2);
        playerGeo.rotateY(Math.PI / 4);
        const playerMat = new THREE.MeshStandardMaterial({ color: COLORS.player, emissive: 0x0044aa, roughness: 0.2, metalness: 0.8 });
        const playerMesh = new THREE.Mesh(playerGeo, playerMat);
        scene.add(playerMesh);

        // Enemy Geometry
        const enemyGeo = new THREE.OctahedronGeometry(0.5);
        const enemyMat = new THREE.MeshStandardMaterial({ color: COLORS.enemy, emissive: 0x550022, roughness: 0.1 });

        // Starfield
        const starGeo = new THREE.BufferGeometry();
        const starCount = 200;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i++) starPos[i] = (Math.random() - 0.5) * 40;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.8 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- GAME LOGIC ---

        function spawnEnemy() {
            const mesh = new THREE.Mesh(enemyGeo, enemyMat);
            const x = (Math.random() - 0.5) * WORLD_W;
            mesh.position.set(x, -8, 0);
            scene.add(mesh);
            state.enemies.push({ mesh, x, y: -8, speed: 0.05 + (state.wave * 0.01) });
        }

        function spawnBullet() {
            const geo = new THREE.BoxGeometry(0.1, 0.6, 0.1);
            const mat = new THREE.MeshBasicMaterial({ color: COLORS.bullet });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(state.player.x, state.player.y + 0.5, 0);
            scene.add(mesh);
            state.bullets.push({ mesh, x: state.player.x, y: state.player.y + 0.5 });
        }

        function createExplosion(x, y, color) {
            const count = 10;
            for(let i=0; i<count; i++) {
                const geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                const mat = new THREE.MeshBasicMaterial({ color: color });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, 0);
                scene.add(mesh);
                state.particles.push({
                    mesh,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    life: 1.0
                });
            }
        }

        function resetGame() {
            // Clear entities
            state.enemies.forEach(e => scene.remove(e.mesh));
            state.bullets.forEach(b => scene.remove(b.mesh));
            state.particles.forEach(p => scene.remove(p.mesh));
            state.enemies = [];
            state.bullets = [];
            state.particles = [];
            
            state.score = 0;
            state.lives = 3;
            state.wave = 1;
            state.over = false;
            state.ready = true;
            state.player.x = 0;
            state.player.y = -6;

            document.getElementById('overlay').style.opacity = 0;
            document.getElementById('overlay').style.pointerEvents = 'none';
            updateHUD();
        }

        function gameOver() {
            state.over = true;
            state.ready = false;
            document.getElementById('overlay').style.opacity = 1;
            document.getElementById('overlay').style.pointerEvents = 'auto';
            document.querySelector('#overlay h1').innerText = "GAME OVER";
            document.querySelector('#overlay p').innerText = `Final Score: ${state.score}`;
            document.getElementById('startBtn').innerText = "TRY AGAIN";
        }

        function updateHUD() {
            document.getElementById('scoreEl').innerText = `SCORE: ${state.score}`;
            document.getElementById('livesEl').innerText = `LIVES: ${state.lives}`;
        }

        // --- INPUT ---
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false, " ": false };
        
        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // Touch Controls
        const setupTouch = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('pointerup', (e) => { e.preventDefault(); keys[key] = false; });
            el.addEventListener('pointerleave', (e) => { keys[key] = false; });
        };
        setupTouch('btnLeft', 'ArrowLeft');
        setupTouch('btnRight', 'ArrowRight');
        setupTouch('btnFire', ' ');

        document.getElementById('startBtn').addEventListener('click', resetGame);

        // --- MAIN LOOP ---
        let shake = 0;
        let fireTimer = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (!state.ready) {
                // Idle animation
                stars.rotation.z += 0.001;
                renderer.render(scene, camera);
                return;
            }

            state.frame++;

            // 1. Player Movement (Eased)
            let dx = 0;
            if (keys.ArrowLeft || keys.a) dx = -1;
            if (keys.ArrowRight || keys.d) dx = 1;
            
            // Smooth lerp
            state.player.x += dx * PLAYER_SPEED;
            state.player.x = Math.max(-WORLD_W/2, Math.min(WORLD_W/2, state.player.x));
            
            // Tilt effect
            playerMesh.rotation.z = -dx * 0.5;
            playerMesh.position.x = state.player.x;
            playerMesh.position.y = state.player.y;

            // 2. Shooting
            if (fireTimer > 0) fireTimer--;
            if (keys[" "] && fireTimer === 0) {
                spawnBullet();
                fireTimer = FIRE_COOLDOWN;
            }

            // 3. Bullets
            for (let i = state.bullets.length - 1; i >= 0; i--) {
                const b = state.bullets[i];
                b.y += BULLET_SPEED;
                b.mesh.position.y = b.y;
                
                // Cleanup
                if (b.y > 10) {
                    scene.remove(b.mesh);
                    state.bullets.splice(i, 1);
                }
            }

            // 4. Enemies
            // Spawn logic
            if (state.frame % Math.max(20, 60 - state.wave * 2) === 0) {
                spawnEnemy();
            }

            // Difficulty ramp
            if (state.score > state.wave * 500) {
                state.wave++;
                updateHUD();
            }

            for (let i = state.enemies.length - 1; i >= 0; i--) {
                const e = state.enemies[i];
                e.y += e.speed;
                e.mesh.position.y = e.y;
                e.mesh.rotation.x += 0.05;
                e.mesh.rotation.y += 0.05;

                // Collision: Enemy vs Player
                const dist = Math.hypot(e.x - state.player.x, e.y - state.player.y);
                if (dist < 1.0) {
                    createExplosion(e.x, e.y, COLORS.enemy);
                    scene.remove(e.mesh);
                    state.enemies.splice(i, 1);
                    state.lives--;
                    shake = 1.0;
                    updateHUD();
                    if (state.lives <= 0) gameOver();
                    continue;
                }

                // Collision: Enemy vs Bottom
                if (e.y > 8) {
                    scene.remove(e.mesh);
                    state.enemies.splice(i, 1);
                    state.lives--;
                    shake = 0.5;
                    updateHUD();
                    if (state.lives <= 0) gameOver();
                    continue;
                }

                // Collision: Enemy vs Bullet
                for (let j = state.bullets.length - 1; j >= 0; j--) {
                    const b = state.bullets[j];
                    if (Math.hypot(e.x - b.x, e.y - b.y) < 0.8) {
                        // Hit!
                        createExplosion(e.x, e.y, COLORS.enemy);
                        createExplosion(b.x, b.y, COLORS.bullet);
                        
                        scene.remove(e.mesh);
                        state.enemies.splice(i, 1);
                        
                        scene.remove(b.mesh);
                        state.bullets.splice(j, 1);
                        
                        state.score += 100;
                        updateHUD();
                        break; // Break bullet loop
                    }
                }
            }

            // 5. Particles
            for (let i = state.particles.length - 1; i >= 0; i--) {
                const p = state.particles[i];
                p.mesh.position.x += p.vx;
                p.mesh.position.y += p.vy;
                p.life -= 0.05;
                p.mesh.scale.setScalar(p.life);
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    state.particles.splice(i, 1);
                }
            }

            // 6. Visual Effects
            // Screen Shake
            if (shake > 0) {
                camera.position.x = (Math.random() - 0.5) * shake;
                camera.position.y = 2 + (Math.random() - 0.5) * shake;
                shake *= 0.9;
                if (shake < 0.05) {
                    shake = 0;
                    camera.position.set(0, 2, 12);
                }
            }

            // Starfield movement
            const positions = stars.geometry.attributes.position.array;
            for(let i=1; i<positions.length; i+=3) {
                positions[i] += 0.05;
                if(positions[i] > 10) positions[i] = -10;
            }
            stars.geometry.attributes.position.needsUpdate = true;

            // Update State for Grader
            window.__game = {
                ready: state.ready,
                score: state.score,
                lives: state.lives,
                over: state.over,
                player: { x: state.player.x, y: state.player.y },
                enemies: state.enemies.map(e => ({ x: e.x, y: e.y })),
                bullets: state.bullets.map(b => ({ x: b.x, y: b.y }))
            };

            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Init
        window.__game = { ready: false, score: 0, lives: 3, over: false, player: {x:0, y:0}, enemies: [], bullets: [], reset: resetGame };
        animate();

    </script>
<script src="../../../touch.js"></script>
</body>
</html>
