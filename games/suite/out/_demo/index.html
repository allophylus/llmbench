<!DOCTYPE html><html><head><meta charset=utf-8><style>body{margin:0}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
const r=new THREE.WebGLRenderer();r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
const sc=new THREE.Scene();const cam=new THREE.PerspectiveCamera(50,1,0.1,100);cam.position.set(0,6,14);cam.lookAt(0,2,0);
sc.add(new THREE.AmbientLight(0xffffff,1));
const box=new THREE.Mesh(new THREE.BoxGeometry(12,10,12),new THREE.MeshNormalMaterial({wireframe:true}));box.position.y=5;sc.add(box);
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let G=null;
const S={ready:false,seed:0,balls:[],score:0,over:false,
 step(dt){G.t+=dt; // drop
  if(G.t>=G.nextDrop&&S.balls.length<25){S.balls.push({x:(G.rnd()-0.5)*8,y:9,z:(G.rnd()-0.5)*8,vx:0,vy:0,vz:0,r:0.5,settled:false,rest:0});G.nextDrop+=0.5;}
  const g=-9.8;
  for(const b of S.balls){ if(b.settled)continue; b.vy+=g*dt; b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
   const lim=6-0.5;
   if(b.x>lim){b.x=lim;b.vx*=-0.6} if(b.x<-lim){b.x=-lim;b.vx*=-0.6}
   if(b.z>lim){b.z=lim;b.vz*=-0.6} if(b.z<-lim){b.z=-lim;b.vz*=-0.6}
   if(b.y<0.5){b.y=0.5;b.vy*=-0.6;b.vx*=0.99;b.vz*=0.99}
  }
  for(let i=0;i<S.balls.length;i++)for(let j=i+1;j<S.balls.length;j++){const a=S.balls[i],c=S.balls[j];const dx=c.x-a.x,dy=c.y-a.y,dz=c.z-a.z;const d=Math.hypot(dx,dy,dz);
   if(d>0&&d<1){const nx=dx/d,ny=dy/d,nz=dz/d,ov=(1-d)/2;a.x-=nx*ov;a.y-=ny*ov;a.z-=nz*ov;c.x+=nx*ov;c.y+=ny*ov;c.z+=nz*ov;
   const rv=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny+(c.vz-a.vz)*nz;if(rv<0){a.vx+=nx*rv;a.vy+=ny*rv;a.vz+=nz*rv;c.vx-=nx*rv;c.vy-=ny*rv;c.vz-=nz*rv;}}}
  for(const b of S.balls){const sp=Math.hypot(b.vx,b.vy,b.vz);if(b.y<=0.51&&sp<0.3){b.vx*=0.85;b.vz*=0.85;if(Math.abs(b.vy)<0.12)b.vy=0;}
   if(b.y<=0.51&&Math.hypot(b.vx,b.vy,b.vz)<0.05){} b.rest=b.y<=0.51&&sp<0.3?b.rest+1:0; if(b.rest>=40){b.settled=true;b.vx=b.vy=b.vz=0;b.y=0.5;}}
  S.score=S.balls.filter(b=>b.settled).length*10;
  if(S.balls.length===25&&S.balls.every(b=>b.settled||Math.hypot(b.vx,b.vy,b.vz)<0.2)){S.score+=50;S.over=true;}
 },
 reset(seed){S.seed=seed;S.balls=[];S.score=0;S.over=false;const rr=mul(seed);G={t:0,nextDrop:0,rnd:rr};if(!S.ready){S.balls.push({x:0,y:9,z:0,vx:0,vy:0,vz:0,r:0.5,settled:false,rest:0});}},
 hash(){return S.balls.map(b=>[b.x,b.y,b.z,b.vx,b.vy,b.vz].map(v=>v.toFixed(4)).join(',')).join(';')+'|'+S.score}
};
window.__game=S;S.ready=true;S.reset(1234);
let last=performance.now();
function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;S.step(dt);S.ready=true;S.balls.forEach(()=>0);r.render(sc,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
