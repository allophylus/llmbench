<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEBULA STRIKE</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060f;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  #hud{position:fixed;top:0;left:0;right:0;padding:14px 18px;pointer-events:none;
    display:flex;justify-content:space-between;align-items:flex-start;z-index:5;}
  .lbl{font-size:11px;letter-spacing:3px;color:#5fd6ff;opacity:.75;font-weight:600;}
  #score{font-size:34px;font-weight:800;color:#eafcff;line-height:1;
    text-shadow:0 0 14px rgba(95,214,255,.6);}
  #wave{font-size:15px;font-weight:700;color:#ffcf5c;letter-spacing:2px;
    text-shadow:0 0 10px rgba(255,160,60,.5);}
  #lives{display:flex;gap:6px;margin-top:6px;}
  .life{width:16px;height:16px;background:#ff5c7a;transform:rotate(45deg);
    box-shadow:0 0 10px rgba(255,92,122,.8);border-radius:2px;}
  .life.off{background:transparent;box-shadow:none;border:1px solid rgba(255,92,122,.4);}
  #msg{position:fixed;top:38%;left:0;right:0;text-align:center;pointer-events:none;
    z-index:6;font-weight:800;font-size:44px;letter-spacing:6px;color:#eafcff;
    text-shadow:0 0 24px rgba(95,214,255,.8);opacity:0;transition:opacity .3s;}
  #msg small{display:block;font-size:16px;letter-spacing:4px;color:#ffcf5c;margin-top:10px;font-weight:600;}
  #touch{position:fixed;bottom:0;left:0;right:0;padding:16px;z-index:7;
    display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;}
  .pad{display:flex;gap:12px;pointer-events:auto;}
  .btn{width:64px;height:64px;border-radius:16px;border:1px solid rgba(95,214,255,.4);
    background:rgba(20,40,70,.35);color:#bfe9ff;font-size:26px;font-weight:800;
    display:flex;align-items:center;justify-content:center;touch-action:none;
    backdrop-filter:blur(2px);box-shadow:0 0 12px rgba(95,214,255,.15) inset;}
  .btn:active{background:rgba(95,214,255,.35);color:#fff;}
  #fire{width:84px;height:84px;border-radius:50%;font-size:15px;letter-spacing:1px;
    border-color:rgba(255,92,122,.5);color:#ffd0da;box-shadow:0 0 16px rgba(255,92,122,.25) inset;}
  #fire:active{background:rgba(255,92,122,.4);}
  @media (min-width:700px){#touch{display:none;}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><div class="lbl">SCORE</div><div id="score">0</div></div>
  <div style="text-align:right"><div class="lbl">WAVE</div><div id="wave">1</div>
    <div id="lives"></div></div>
</div>
<div id="msg"></div>
<div id="touch">
  <div class="pad">
    <div class="btn" data-k="left">&#9664;</div>
    <div class="btn" data-k="right">&#9654;</div>
  </div>
  <div class="pad"><div class="btn" id="fire" data-k="fire">FIRE</div></div>
</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const W=16, H=20, SHIP_Y=-8.5, BULLET_SPEED=34, ENEMY_SPEED=3.2;
const PAL={cyan:0x5fd6ff, gold:0xffcf5c, magenta:0xff5c7a, green:0x7dffb0, white:0xeafcff};

let renderer, scene, camera, clock, bg, nebula, stars, starData, ship, shipGlow, engine, engineGlow;
let bullets=[], enemies=[], particles=[], pPool=[];
let score=0, lives=3, wave=1, over=false, ready=false, shake=0, flash=0, invuln=0;
let spawnTimer=0, spawnInterval=1.1, fireCd=0, msgTimer=0, msgShown='';
const keys={left:false,right:false,fire:false};
const player={x:0,y:SHIP_Y};

const $=id=>document.getElementById(id);
const scoreEl=$('score'), waveEl=$('wave'), livesEl=$('lives'), msgEl=$('msg');

function init(){
  renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  scene=new THREE.Scene();
  camera=new THREE.OrthographicCamera(-W/2,W/2,H/2,-H/2,0.1,100);
  camera.position.z=10;
  clock=new THREE.Clock();
  buildBackground();
  buildShip();
  buildPool();
  window.__game={ready:true,score:0,lives:3,over:false,player:{x:0,y:SHIP_Y},enemies:[],bullets:[],reset:reset};
  ready=true;
  showMsg('NEBULA STRIKE','TAP FIRE / SPACE TO SHOOT');
  addEventListener('resize',onResize);
  onResize();
  animate();
}

function buildBackground(){
  const g=new THREE.BufferGeometry();
  const pos=new Float32Array(6), col=new Float32Array(6);
  const c1=new THREE.Color(0x0a0e24), c2=new THREE.Color(0x1a0f2e), c3=new THREE.Color(0x04121f);
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  pos.set([-1,-1,0, 1,-1,0, 1,1,0, -1,-1,0, 1,1,0, -1,1,0]);
  col.set([c1.r,c1.g,c1.b, c2.r,c2.g,c2.b, c3.r,c3.g,c3.b, c1.r,c1.g,c1.b, c2.r,c2.g,c2.b, c3.r,c3.g,c3.b]);
  bg=new THREE.Mesh(g,new THREE.ShaderMaterial({
    vertexShader:`varying vec2 v;void main(){v=position.xy;gl_Position=vec4(position.xy,0.,1.);}`,
    fragmentShader:`varying vec2 v;
      void main(){
        vec3 a=vec3(.04,.05,.14),b=vec3(.10,.06,.18),c=vec3(.02,.07,.12);
        float t=(v.y+1.)*.5;
        vec3 col=mix(a,b,smoothstep(0.,.6,t));
        col=mix(col,c,smoothstep(.5,1.,t));
        float d=length(v*vec2(.7,1.));
        col+=vec3(.05,.03,.08)*smoothstep(1.2,.0,d);
        gl_FragColor=vec4(col,1.);
      }`,depthTest:false,depthWrite:false}));
  bg.renderOrder=-10; bg.frustumCulled=false; scene.add(bg);

  // nebula blobs
  const nb=new THREE.Group();
  const blob=(x,y,r,c,o)=>{const m=new THREE.Mesh(new THREE.CircleGeometry(r,32),
    new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false}));
    m.position.set(x,y,-9);m.renderOrder=-9;nb.add(m);};
  blob(-4,3,7,PAL.cyan,.10); blob(5,-2,8,PAL.magenta,.09); blob(0,7,6,PAL.gold,.06);
  blob(3,4,5,PAL.green,.05); blob(-5,-4,6,PAL.cyan,.07);
  scene.add(nb); nebula=nb;

  // stars
  const N=140, sp=new Float32Array(N*3), sc=new Float32Array(N*3);
  starData=[];
  for(let i=0;i<N;i++){
    const x=(Math.random()*2-1)*W/2, y=(Math.random()*2-1)*H/2, z=-8+Math.random()*2;
    sp[i*3]=x;sp[i*3+1]=y;sp[i*3+2]=z;
    const b=.4+Math.random()*.6;
    sc[i*3]=b;sc[i*3+1]=b;sc[i*3+2]=b*(.8+Math.random()*.4);
    starData.push({x,y,sp:1+Math.random()*3});
  }
  const sg=new THREE.BufferGeometry();
  sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  sg.setAttribute('color',new THREE.BufferAttribute(sc,3));
  stars=new THREE.Points(sg,new THREE.PointsMaterial({size:.14,vertexColors:true,
    transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
  stars.renderOrder=-8; scene.add(stars);
}

function buildShip(){
  ship=new THREE.Group();
  const body=new THREE.Mesh(new THREE.ConeGeometry(.55,1.5,4),
    new THREE.MeshStandardMaterial({color:PAL.cyan,emissive:PAL.cyan,emissiveIntensity:.5,metalness:.4,roughness:.3}));
  body.rotation.x=Math.PI/2; body.rotation.z=Math.PI/4; body.position.y=.1;
  const wing=new THREE.Mesh(new THREE.BoxGeometry(1.7,.12,.5),
    new THREE.MeshStandardMaterial({color:0x2a6f9c,emissive:0x1a4a6a,emissiveIntensity:.4,metalness:.5,roughness:.4}));
  wing.position.y=-.2;
  const tipL=new THREE.Mesh(new THREE.BoxGeometry(.2,.12,.5),
    new THREE.MeshStandardMaterial({color:PAL.magenta,emissive:PAL.magenta,emissiveIntensity:.8}));
  tipL.position.set(-.85,-.2,0);
  const tipR=tipL.clone(); tipR.position.x=.85;
  const cockpit=new THREE.Mesh(new THREE.SphereGeometry(.22,12,12),
    new THREE.MeshStandardMaterial({color:PAL.white,emissive:PAL.cyan,emissiveIntensity:.6}));
  cockpit.position.set(0,.15,.25);
  ship.add(body,wing,tipL,tipR,cockpit);
  shipGlow=new THREE.Mesh(new THREE.CircleGeometry(1.1,24),
    new THREE.MeshBasicMaterial({color:PAL.cyan,transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false}));
  shipGlow.position.z=-.1; ship.add(shipGlow);
  engine=new THREE.Mesh(new THREE.ConeGeometry(.3,.7,8),
    new THREE.MeshBasicMaterial({color:PAL.gold,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
  engine.rotation.x=-Math.PI/2; engine.position.y=-.7; ship.add(engine);
  engineGlow=new THREE.Mesh(new THREE.CircleGeometry(.5,16),
    new THREE.MeshBasicMaterial({color:PAL.gold,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false}));
  engineGlow.position.y=-.7; ship.add(engineGlow);
  ship.position.set(0,SHIP_Y,0);
  scene.add(ship);
}

function buildPool(){
  const geo=new THREE.PlaneGeometry(.28,.28);
  for(let i=0;i<160;i++){
    const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:PAL.white,transparent:true,
      opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
    m.visible=false; scene.add(m);
    pPool.push({m,vx:0,vy:0,life:0,max:1,size:1});
  }
}

function spawnParticle(x,y,color,spd,life,size){
  const p=pPool.find(p=>!p.m.visible); if(!p)return;
  const a=Math.random()*Math.PI*2, s=spd*(.4+Math.random()*.8);
  p.m.visible=true; p.m.position.set(x,y,0);
  p.m.material.color.setHex(color); p.m.material.opacity=1;
  p.m.scale.set(size,size,1);
  p.vx=Math.cos(a)*s; p.vy=Math.sin(a)*s; p.life=life; p.max=life; p.size=size;
  particles.push(p);
}
function burst(x,y,color,n,spd,life,size){for(let i=0;i<n;i++)spawnParticle(x,y,color,spd,life,size);}

function fire(){
  if(fireCd>0||over)return; fireCd=.16;
  const b=new THREE.Mesh(new THREE.PlaneGeometry(.22,.7),
    new THREE.MeshBasicMaterial({color:PAL.cyan,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false}));
  b.position.set(player.x,SHIP_Y+.9,0); scene.add(b);
  bullets.push({m:b,x:player.x,y:SHIP_Y+.9});
  burst(player.x,SHIP_Y+.9,PAL.cyan,3,4,.25,.5);
}

function spawnEnemy(){
  const x=(Math.random()*2-1)*(W/2-1.2);
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.ConeGeometry(.6,1.1,4),
    new THREE.MeshStandardMaterial({color:PAL.magenta,emissive:PAL.magenta,emissiveIntensity:.5,metalness:.4,roughness:.4}));
  body.rotation.x=-Math.PI/2; body.rotation.z=Math.PI/4;
  const core=new THREE.Mesh(new THREE.SphereGeometry(.28,10,10),
    new THREE.MeshBasicMaterial({color:PAL.gold,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
  g.add(body,core);
  g.position.set(x,H/2+.8,0); scene.add(g);
  enemies.push({m:g,x,y:H/2+.8,vy:ENEMY_SPEED*(1+wave*.08),phase:Math.random()*6,core});
}

function killEnemy(e){
  scene.remove(e.m);
  const i=enemies.indexOf(e); if(i>=0)enemies.splice(i,1);
  score+=100;
  burst(e.x,e.y,PAL.magenta,14,7,.6,.7);
  burst(e.x,e.y,PAL.gold,8,5,.5,.5);
  shake=Math.min(shake+.5,1.4);
}

function hitPlayer(){
  if(invuln>0||over)return;
  lives--; invuln=1.6; flash=1; shake=1.6;
  burst(player.x,SHIP_Y,PAL.magenta,20,8,.7,.8);
  burst(player.x,SHIP_Y,PAL.white,10,6,.5,.6);
  if(lives<=0)gameOver();
}

function gameOver(){
  over=true;
  burst(player.x,SHIP_Y,PAL.cyan,30,10,.9,1);
  burst(player.x,SHIP_Y,PAL.magenta,20,8,.8,.8);
  ship.visible=false;
  showMsg('GAME OVER','PRESS R / TAP TO RESTART');
}

function reset(){
  bullets.forEach(b=>scene.remove(b.m)); bullets=[];
  enemies.forEach(e=>scene.remove(e.m)); enemies=[];
  particles.forEach(p=>{p.m.visible=false;}); particles=[];
  score=0; lives=3; wave=1; over=false; invuln=1; shake=0; flash=0;
  spawnTimer=0; spawnInterval=1.1; fireCd=0;
  player.x=0; ship.visible=true; ship.position.set(0,SHIP_Y,0);
  showMsg('NEBULA STRIKE','WAVE 1');
}

function showMsg(t,s){
  msgEl.innerHTML=t+(s?`<small>${s}</small>`:'');
  msgEl.style.opacity=1; msgTimer=2.2; msgShown=t;
}

function onResize(){
  const a=innerWidth/innerHeight;
  if(a>W/H){camera.left=-H/2*a;camera.right=H/2*a;camera.top=H/2;camera.bottom=-H/2;}
  else{camera.top=H/2;camera.bottom=-H/2;camera.left=-W/2;camera.right=W/2;}
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}

function update(dt){
  // stars drift
  const sp=stars.geometry.attributes.position.array;
  for(let i=0;i<starData.length;i++){
    starData[i].y-=starData[i].sp*dt;
    if(starData[i].y<-H/2){starData[i].y=H/2;starData[i].x=(Math.random()*2-1)*W/2;}
    sp[i*3]=starData[i].x; sp[i*3+1]=starData[i].y;
  }
  stars.geometry.attributes.position.needsUpdate=true;
  nebula.rotation.z+=dt*.02;

  if(!over){
    // player move (eased)
    const dir=(keys.right?1:0)-(keys.left?1:0);
    const target=THREE.MathUtils.clamp(player.x+dir*14*dt,-W/2+1,W/2-1);
    player.x+=(target-player.x)*Math.min(1,dt*12);
    ship.position.x=player.x;
    ship.rotation.z=THREE.MathUtils.lerp(ship.rotation.z,-dir*.35,Math.min(1,dt*10));
    ship.position.y=SHIP_Y+Math.sin(clock.elapsedTime*3)*.08;
    if(keys.fire)fire();
    fireCd-=dt; invuln-=dt;
    // spawn
    spawnTimer-=dt;
    if(spawnTimer<=0){spawnEnemy();spawnTimer=spawnInterval;}
    // bullets
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i]; b.y+=BULLET_SPEED*dt; b.m.position.y=b.y;
      if(b.y>H/2+.5){scene.remove(b.m);bullets.splice(i,1);}
    }
    // enemies
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i]; e.y-=e.vy*dt; e.phase+=dt*2;
      e.m.position.y=e.y; e.m.position.x=e.x+Math.sin(e.phase)*.4;
      e.core.material.opacity=.6+Math.sin(e.phase*3)*.3;
      if(e.y<-H/2+.8){scene.remove(e.m);enemies.splice(i,1);hitPlayer();continue;}
      // bullet collision
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j];
        if(Math.abs(b.x-e.m.position.x)<.85&&Math.abs(b.y-e.y)<.85){
          scene.remove(b.m);bullets.splice(j,1);killEnemy(e);break;
        }
      }
    }
    // wave progression
    const nw=Math.floor(score/500)+1;
    if(nw>wave){wave=nw;spawnInterval=Math.max(.35,1.1-wave*.07);showMsg('WAVE '+wave,'');}
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.life-=dt;
    if(p.life<=0){p.m.visible=false;particles.splice(i,1);continue;}
    p.m.position.x+=p.vx*dt; p.m.position.y+=p.vy*dt;
    p.vx*=.94; p.vy*=.94;
    const t=p.life/p.max;
    p.m.material.opacity=t; p.m.scale.set(p.size*t,p.size*t,1);
  }

  // engine flicker
  const fl=.7+Math.sin(clock.elapsedTime*30)*.3;
  engine.scale.y=.8+fl*.4; engineGlow.material.opacity=.3+fl*.3;
  shipGlow.material.opacity=invuln>0?(Math.sin(clock.elapsedTime*20)>0?.3:.05):.18;

  // shake + flash
  shake=Math.max(0,shake-dt*3); flash=Math.max(0,flash-dt*2.5);
  const sx=(Math.random()*2-1)*shake*.4, sy=(Math.random()*2-1)*shake*.4;
  camera.position.x=sx; camera.position.y=sy;
  bg.material.uniforms; // (no-op)
  if(flash>0){
    if(!window.__flash){const f=new THREE.Mesh(new THREE.PlaneGeometry(2,2),
      new THREE.MeshBasicMaterial({color:PAL.magenta,transparent:true,opacity:0,depthTest:false}));
      f.renderOrder=10;f.frustumCulled=false;scene.add(f);window.__flash=f;}
    window.__flash.material.opacity=flash*.5;
  } else if(window.__flash)window.__flash.material.opacity=0;

  // msg fade
  if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)msgEl.style.opacity=0;}

  // HUD
  scoreEl.textContent=score; waveEl.textContent=wave;
  let lh=''; for(let i=0;i<3;i++)lh+=`<div class="life${i<lives?'':' off'}"></div>`;
  if(livesEl.innerHTML!==lh)livesEl.innerHTML=lh;

  // machine state
  const g=window.__game;
  g.ready=ready; g.score=score; g.lives=lives; g.over=over;
  g.player.x=player.x; g.player.y=SHIP_Y;
  g.enemies=enemies.map(e=>({x:e.m.position.x,y:e.y}));
  g.bullets=bullets.map(b=>({x:b.x,y:b.y}));
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  update(dt);
  renderer.render(scene,camera);
}

// ---- input ----
const keymap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'fire'};
addEventListener('keydown',e=>{
  if(keymap[e.code]){keys[keymap[e.code]]=true;e.preventDefault();}
  if(e.code==='KeyR'&&over)reset();
});
addEventListener('keyup',e=>{if(keymap[e.code])keys[keymap[e.code]]=false;});
document.querySelectorAll('.btn').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=true;};
  const off=e=>{e.preventDefault();keys[k]=false;};
  b.addEventListener('pointerdown',on);
  b.addEventListener('pointerup',off);
  b.addEventListener('pointerleave',off);
  b.addEventListener('pointercancel',off);
});
addEventListener('pointerdown',e=>{
  if(over&&!e.target.closest('.btn'))reset();
});

init();
</script>
</body>
</html>
<script src="../touch.js"></script>
