<script type="module">
import * as THREE from 'three';

const W=16, H=20, SHIP_Y=-8.5, BULLET_Y=9.5, ENEMY_Y=8.5, KILL_Y=-8.2;
const PAL={teal:0x5fd6c9, pink:0xff7ab2, gold:0xffc24b, deep:0x1a2a52, white:0xf4f7ff};

let renderer, scene, camera, bg, bgMat, nebula, starPts, starBase, starSpeed, starTw;
let ship, shipGlow, engine, engineGlow, muzzle, muzzleGlow, muzzleLight;
let bullets=[], enemies=[], particles=[], pPool=[];
let score=0, lives=3, wave=1, over=false, ready=false, shake=0, flash=0, flashColor;
let spawnTimer=0, spawnInterval=1.2, fireCd=0, time=0, last=performance.now();
let msgTimer=0, msgEl, scoreEl, waveEl, livesEl;
const keys={left:false,right:false,fire:false};
const shipState={x:0, vx:0};
const tmpV=new THREE.Vector3(), tmpC=new THREE.Color();

function init(){
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
  camera.position.set(0,0,14); camera.lookAt(0,0,0);

  bgMat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec2 vUv;uniform float uTime;
      void main(){
        vec3 top=vec3(0.05,0.07,0.16), mid=vec3(0.10,0.05,0.14), bot=vec3(0.02,0.03,0.08);
        vec3 col=mix(bot,mid,smoothstep(0.0,0.55,vUv.y));
        col=mix(col,top,smoothstep(0.5,1.0,vUv.y));
        float n=sin(vUv.x*6.0+uTime*0.15)*sin(vUv.y*5.0-uTime*0.1);
        col+=vec3(0.05,0.02,0.08)*n*0.5;
        gl_FragColor=vec4(col,1.0);
      }`});
  bg=new THREE.Mesh(new THREE.PlaneGeometry(60,60),bgMat);
  bg.position.z=-20; scene.add(bg);

  nebula=makeNebula(); scene.add(nebula);
  makeStars();

  scene.add(new THREE.AmbientLight(0x334466,0.6));
  const pl=new THREE.PointLight(0x5fd6c9,1.2,40); pl.position.set(0,0,8); scene.add(pl);

  buildShip();
  buildPool();
  msgEl=document.getElementById('msg');
  scoreEl=document.getElementById('score');
  waveEl=document.getElementById('wave');
  livesEl=document.getElementById('lives');
  updateHUD();
  addEventListener('resize',onResize);
  addEventListener('keydown',e=>{const k=mapKey(e.key);if(k){keys[k]=true;e.preventDefault();}});
  addEventListener('keyup',e=>{const k=mapKey(e.key);if(k)keys[k]=false;});
  document.querySelectorAll('.btn').forEach(b=>{
    const k=b.dataset.k;
    b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;});
    b.addEventListener('pointerup',()=>keys[k]=false);
    b.addEventListener('pointerleave',()=>keys[k]=false);
    b.addEventListener('pointercancel',()=>keys[k]=false);
  });
  window.__game={ready:true,score:0,lives:3,over:false,player:{x:0,y:SHIP_Y},enemies:[],bullets:[],reset:reset};
  ready=true;
  showMsg('NEBULA STRIKE','TAP FIRE OR PRESS SPACE');

function mapKey(k){k=k.toLowerCase();
  if(k==='arrowleft'||k==='a')return 'left';
  if(k==='arrowright'||k==='d')return 'right';
  if(k===' '||k==='spacebar')return 'fire';
  return null;}

function buildShip(){
  ship=new THREE.Group();
  const body=new THREE.Mesh(new THREE.ConeGeometry(0.55,1.7,4),
    new THREE.MeshStandardMaterial({color:PAL.teal,emissive:PAL.teal,emissiveIntensity:0.5,metalness:0.4,roughness:0.3}));
  body.rotation.x=Math.PI/2; body.rotation.y=Math.PI/4; body.position.z=0.1; ship.add(body);
  const wing=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.12,0.5),
    new THREE.MeshStandardMaterial({color:PAL.deep,emissive:PAL.pink,emissiveIntensity:0.4,metalness:0.5,roughness:0.4}));
  wing.position.set(0,-0.15,-0.2); ship.add(wing);
  const cockpit=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,12),
    new THREE.MeshStandardMaterial({color:PAL.white,emissive:PAL.white,emissiveIntensity:0.8}));
  cockpit.position.set(0,0.1,0.35); ship.add(cockpit);
  shipGlow=new THREE.Mesh(new THREE.PlaneGeometry(2.4,2.4),
    new THREE.MeshBasicMaterial({color:PAL.teal,transparent:true,opacity:0.25,blending:THREE.AdditiveBlending,depthWrite:false}));
  shipGlow.position.z=-0.3; ship.add(shipGlow);
  engine=new THREE.Mesh(new THREE.ConeGeometry(0.3,0.9,8),
    new THREE.MeshBasicMaterial({color:PAL.gold,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false}));
  engine.rotation.x=-Math.PI/2; engine.position.set(0,-0.9,0); ship.add(engine);
  engineGlow=new THREE.Mesh(new THREE.PlaneGeometry(1.2,1.2),
    new THREE.MeshBasicMaterial({color:PAL.gold,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false}));
  engineGlow.position.set(0,-1.1,0); ship.add(engineGlow);
  muzzle=new THREE.Mesh(new THREE.SphereGeometry(0.18,10,10),
    new THREE.MeshBasicMaterial({color:PAL.white,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  muzzle.position.set(0,0.9,0.2); ship.add(muzzle);
  muzzleGlow=new THREE.Mesh(new THREE.PlaneGeometry(1.4,1.4),
    new THREE.MeshBasicMaterial({color:PAL.teal,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  muzzleGlow.position.set(0,0.9,0.2); ship.add(muzzleGlow);
  muzzleLight=new THREE.PointLight(PAL.teal,0,6); muzzleLight.position.set(0,0.9,0.5); ship.add(muzzleLight);
  ship.position.set(0,SHIP_Y,0); scene.add(ship);
}

function makeNebula(){
  const g=new THREE.Group();
  const cols=[PAL.pink,PAL.teal,PAL.deep,PAL.gold];
  for(let i=0;i<7;i++){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
      new THREE.MeshBasicMaterial({color:cols[i%4],transparent:true,opacity:0.10+Math.random()*0.08,
        blending:THREE.AdditiveBlending,depthWrite:false}));
    m.position.set((Math.random()-0.5)*14,(Math.random()-0.5)*16,-15+Math.random()*3);
    const s=6+Math.random()*8; m.scale.set(s,s,1);
    m.rotation.z=Math.random()*Math.PI; m.userData={sp:(Math.random()-0.5)*0.05,ph:Math.random()*6};
    g.add(m);
  }
  return g;
}

function makeStars(){
  const N=260, pos=new Float32Array(N*3), base=new Float32Array(N*3), spd=new Float32Array(N), tw=new Float32Array(N);
  for(let i=0;i<N;i++){
    const x=(Math.random()-0.5)*22, y=(Math.random()-0.5)*28, z=-10+Math.random()*6;
    pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;
    base[i*3]=x;base[i*3+1]=y;base[i*3+2]=z;
    spd[i]=0.5+Math.random()*1.5; tw[i]=Math.random()*6;
  }
  starBase=base; starSpeed=spd; starTw=tw;
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  starPts=new THREE.Points(geo,new THREE.PointsMaterial({color:PAL.white,size:0.12,transparent:true,opacity:0.8,
    blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(starPts);
}

function buildPool(){
  const geo=new THREE.PlaneGeometry(0.5,0.5);
  for(let i=0;i<140;i++){
    const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:PAL.white,transparent:true,opacity:0,
      blending:THREE.AdditiveBlending,depthWrite:false}));
    m.visible=false; scene.add(m);
    pPool.push({mesh:m,vel:new THREE.Vector3(),life:0,max:1,size:1});
  }
}

function spawnBurst(x,y,color,count,speed){
  for(let i=0;i<count;i++){
    const p=pPool.find(p=>!p.mesh.visible); if(!p)break;
    p.mesh.visible=true; p.mesh.position.set(x,y,0.5);
    const a=Math.random()*Math.PI*2, s=speed*(0.4+Math.random()*0.8);
    p.vel.set(Math.cos(a)*s,Math.sin(a)*s,0);
    p.life=p.max=0.5+Math.random()*0.5; p.size=0.6+Math.random()*0.8;
    p.mesh.material.color.setHex(color);
  }
}

function spawnEnemy(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.OctahedronGeometry(0.6,0),
    new THREE.MeshStandardMaterial({color:PAL.pink,emissive:PAL.pink,emissiveIntensity:0.5,metalness:0.4,roughness:0.3}));
  g.add(body);
  const core=new THREE.Mesh(new THREE.SphereGeometry(0.25,10,10),
    new THREE.MeshBasicMaterial({color:PAL.gold,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false}));
  g.add(core);
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(2,2),
    new THREE.MeshBasicMaterial({color:PAL.pink,transparent:true,opacity:0.2,blending:THREE.AdditiveBlending,depthWrite:false}));
  glow.position.z=-0.2; g.add(glow);

}

function fire(){

  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:PAL.teal,transparent:true,opacity:1,
    blending:THREE.AdditiveBlending,depthWrite:false}));
  m.position.set(shipState.x,BULLET_Y,0.5); scene.add(m);
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(0.9,0.9),
    new THREE.MeshBasicMaterial({color:PAL.teal,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.add(glow);
  bullets.push({mesh:m,glow});
  muzzle.material.opacity=1; muzzleGlow.material.opacity=0.8; muzzleLight.intensity=2;
  spawnBurst(shipState.x,BULLET_Y,PAL.teal,4,2);

function update(dt){
  time+=dt;
  bgMat.uniforms.uTime.value=time;
  nebula.children.forEach(n=>{n.rotation.z+=n.userData.sp*dt;
    n.material.opacity=0.10+Math.sin(time*0.3+n.userData.ph)*0.05;});

    shipState.x+=shipState.vx*dt;
    shipState.x=Math.max(-7,Math.min(7,shipState.x));
    ship.position.x=shipState.x;
    ship.rotation.z=-shipState.vx*0.03;

    spawnTimer-=dt;

      const b=bullets[i]; b.mesh.position.y+=14*dt;

    }
    for(let i=enemies.length-1;i>=0;i--){

        loseLife();
      }
    }

      const b=bullets[i]; let hit=false;

        const e=enemies[j];
        if(Math.abs(b.mesh.position.x-e.mesh.position.x)<0.9&&Math.abs(b.mesh.position.y-e.mesh.position.y)<0.9){
          hit=true; e.flash=1;
          spawnBurst(e.mesh.position.x,e.mesh.position.y,PAL.pink,18,5);
          spawnBurst(e.mesh.position.x,e.mesh.position.y,PAL.gold,8,3);
          scene.remove(e.mesh); enemies.splice(j,1);
          score+=100; shake=Math.min(1,shake+0.4); flash=0.3; flashColor=PAL.pink;
          updateHUD(); break;
        }
      }
      if(hit){scene.remove(b.mesh);bullets.splice(i,1);}
    }
  }

  for(const p of pPool){
    if(!p.mesh.visible)continue;
    p.life-=dt;
    if(p.life<=0){p.mesh.visible=false;continue;}
    p.mesh.position.addScaledVector(p.vel,dt);
    p.vel.multiplyScalar(0.94);
    const t=p.life/p.max;
    p.mesh.material.opacity=t;
    p.mesh.scale.setScalar(p.size*t);
  }

  shake*=0.88; flash*=0.9;
  if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)msgEl.style.opacity=0;}
}

function loseLife(){
  lives--; shake=1; flash=0.6; flashColor=PAL.pink;
  spawnBurst(shipState.x,SHIP_Y,PAL.pink,24,6);
  updateHUD();
  if(lives<=0){over=true;showMsg('GAME OVER','SCORE '+score+'  ·  TAP TO RESTART');}
}

function updateHUD(){
  scoreEl.textContent=score;

  livesEl.innerHTML=h;
}

function showMsg(t,s){
  msgEl.innerHTML=t+(s?`<small>${s}</small>`:'');
  msgEl.style.opacity=1; msgTimer=2.5;
}
