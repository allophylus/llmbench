<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Grid Racer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; font-family: 'Courier New', Courier, monospace; user-select: none; -webkit-user-select: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .hud { padding: 20px; color: #00ffff; text-shadow: 0 0 5px #00ffff; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; }
        .controls { pointer-events: auto; display: flex; justify-content: space-between; padding: 20px; padding-bottom: 40px; }
        .btn { width: 80px; height: 80px; background: rgba(255, 255, 255, 0.1); border: 2px solid #00ffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; touch-action: none; cursor: pointer; }
        .btn:active { background: rgba(0, 255, 255, 0.4); }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; pointer-events: auto; z-index: 10; }
        h1 { font-size: 40px; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; margin-bottom: 10px; }
        button.start-btn { padding: 15px 40px; font-size: 20px; background: #00ffff; border: none; color: #000; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button.start-btn:hover { background: #fff; box-shadow: 0 0 15px #00ffff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="ui">
    <div class="hud">
        <span id="scoreEl">SCORE: 0</span>
        <span id="timeEl">TIME: 60</span>
        <span id="livesEl">LIVES: 3</span>
    </div>
    <div class="controls">
        <div style="display:flex; gap:10px;">
            <div class="btn" id="btnLeft">◄</div>
            <div class="btn" id="btnRight">►</div>
        </div>
        <div style="display:flex; gap:10px;">
            <div class="btn" id="btnBrake">▼</div>
            <div class="btn" id="btnGas">▲</div>
        </div>
    </div>
</div>

<div id="overlay">
    <h1>NEON GRID</h1>
    <p id="statusText">Collect Waypoints. Avoid Buildings.</p>
    <button class="start-btn" onclick="startGame()">START MISSION</button>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- CONFIGURATION ---
const GRID_SIZE = 10;
const CELL_SIZE = 40;
const MAP_SIZE = GRID_SIZE * CELL_SIZE;
const COLORS = {
    bg: 0x050510,
    road: 0x1a1a24,
    roadLine: 0x333344,
    building: 0x2a2a35,
    buildingTop: 0x444455,
    player: 0x00ffff,
    enemy: 0xff0055,
    waypoint: 0xffaa00,
    particle: 0xffffff
};

// --- STATE ---
let scene, camera, renderer;
let player, playerMesh;
let buildings = [];
let waypoints = [];
let enemies = [];
let particles = [];
let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false, " ": false };
let gameActive = false;
let lastTime = 0;
let shakeIntensity = 0;

const state = {
    ready: true,
    score: 0,
    lives: 3,
    over: false,
    player: { x: 0, y: 0 },
    enemies: [],
    bullets: [],
    reset: function() {
        this.score = 0;
        this.lives = 3;
        this.over = false;
        this.ready = true;
        initGame();
    }
};

// --- INIT ---
function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(COLORS.bg);
    scene.fog = new THREE.FogExp2(COLORS.bg, 0.008);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 150, 100);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    const ambient = new THREE.AmbientLight(0x404040, 2);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(100, 200, 100);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // Ground
    const planeGeo = new THREE.PlaneGeometry(MAP_SIZE * 2, MAP_SIZE * 2);
    const planeMat = new THREE.MeshStandardMaterial({ color: 0x0a0a10 });
    const ground = new THREE.Mesh(planeGeo, planeMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid Helper (Visual only)
    const grid = new THREE.GridHelper(MAP_SIZE * 2, 100, 0x222233, 0x111122);
    scene.add(grid);

    window.addEventListener('resize', onWindowResize);
    
    // Keyboard Input
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);
    
    // Touch Controls
    setupTouch('btnLeft', 'ArrowLeft');
    setupTouch('btnRight', 'ArrowRight');
    setupTouch('btnGas', 'ArrowUp');
    setupTouch('btnBrake', 'ArrowDown');

    initGame();
    requestAnimationFrame(animate);
}

function setupTouch(id, key) {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[key] = true; });
    el.addEventListener('pointerup', (e) => { e.preventDefault(); keys[key] = false; });
    el.addEventListener('pointerleave', (e) => { keys[key] = false; });
}

function initGame() {
    // Clear old
    if(playerMesh) scene.remove(playerMesh);
    buildings.forEach(b => scene.remove(b));
    waypoints.forEach(w => scene.remove(w.mesh));
    enemies.forEach(e => scene.remove(e.mesh));
    particles.forEach(p => scene.remove(p.mesh));
    
    buildings = [];
    waypoints = [];
    enemies = [];
    particles = [];

    // Generate City
    const boxGeo = new THREE.BoxGeometry(CELL_SIZE - 2, 40, CELL_SIZE - 2);
    const boxMat = new THREE.MeshStandardMaterial({ color: COLORS.building, roughness: 0.2 });
    
    for(let x = -GRID_SIZE/2; x < GRID_SIZE/2; x++) {
        for(let z = -GRID_SIZE/2; z < GRID_SIZE/2; z++) {
            // Random buildings, leave center clear
            if (Math.abs(x) < 2 && Math.abs(z) < 2) continue;
            if (Math.random() > 0.7) {
                const b = new THREE.Mesh(boxGeo, boxMat);
                b.position.set(x * CELL_SIZE, 20, z * CELL_SIZE);
                b.castShadow = true;
                b.receiveShadow = true;
                scene.add(b);
                buildings.push({ mesh: b, x: x * CELL_SIZE, z: z * CELL_SIZE, w: CELL_SIZE-2, d: CELL_SIZE-2 });
            }
        }
    }

    // Player
    const pGeo = new THREE.BoxGeometry(6, 2, 10);
    const pMat = new THREE.MeshStandardMaterial({ color: COLORS.player, emissive: 0x004444 });
    playerMesh = new THREE.Mesh(pGeo, pMat);
    playerMesh.position.set(0, 1, 0);
    playerMesh.castShadow = true;
    scene.add(playerMesh);
    
    // Player Physics
    player = { x: 0, z: 0, angle: 0, speed: 0, maxSpeed: 1.5, turnSpeed: 0.05 };

    // Waypoints
    const wGeo = new THREE.OctahedronGeometry(3);
    const wMat = new THREE.MeshStandardMaterial({ color: COLORS.waypoint, emissive: COLORS.waypoint, emissiveIntensity: 0.8 });
    for(let i=0; i<5; i++) {
        spawnWaypoint(wGeo, wMat);
    }

    // Enemies
    const eGeo = new THREE.BoxGeometry(6, 2, 10);
    const eMat = new THREE.MeshStandardMaterial({ color: COLORS.enemy });
    for(let i=0; i<8; i++) {
        spawnEnemy(eGeo, eMat);
    }

    updateHUD();
}

function spawnWaypoint(geo, mat) {
    let valid = false;
    let x, z;
    while(!valid) {
        x = (Math.floor(Math.random() * GRID_SIZE) - GRID_SIZE/2) * CELL_SIZE;
        z = (Math.floor(Math.random() * GRID_SIZE) - GRID_SIZE/2) * CELL_SIZE;
        // Check collision with buildings
        valid = true;
        for(let b of buildings) {
            if(Math.abs(x - b.x) < CELL_SIZE && Math.abs(z - b.z) < CELL_SIZE) valid = false;
        }
    }
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 5, z);
    scene.add(mesh);
    waypoints.push({ mesh, x, z });
}

function spawnEnemy(geo, mat) {
    let x, z;
    do {
        x = (Math.floor(Math.random() * GRID_SIZE) - GRID_SIZE/2) * CELL_SIZE;
        z = (Math.floor(Math.random() * GRID_SIZE) - GRID_SIZE/2) * CELL_SIZE;
    } while (Math.abs(x) < 50 && Math.abs(z) < 50); // Don't spawn on player

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 1, z);
    scene.add(mesh);
    enemies.push({ 
        mesh, 
        x, z, 
        vx: (Math.random() - 0.5) * 0.8, 
        vz: (Math.random() - 0.5) * 0.8 
    });
}

// --- GAME LOOP ---
function animate(time) {
    requestAnimationFrame(animate);
    
    const dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;

    if (gameActive) {
        updatePlayer(dt);
        updateEnemies(dt);
        updateParticles(dt);
        updateHUD();
    }

    updateCamera();
    renderer.render(scene, camera);
}

function updatePlayer(dt) {
    // Input
    if (keys.ArrowUp || keys.w) player.speed += 0.05;
    if (keys.ArrowDown || keys.s) player.speed -= 0.05;
    
    // Friction
    player.speed *= 0.95;
    
    // Turning
    if (Math.abs(player.speed) > 0.1) {
        const dir = player.speed > 0 ? 1 : -1;
        if (keys.ArrowLeft || keys.a) player.angle += player.turnSpeed * dir;
        if (keys.ArrowRight || keys.d) player.angle -= player.turnSpeed * dir;
    }

    // Velocity
    const vx = Math.sin(player.angle) * player.speed;
    const vz = Math.cos(player.angle) * player.speed;

    // Proposed Position
    let nextX = player.x + vx;
    let nextZ = player.z + vz;

    // Collision with Buildings
    let collided = false;
    for (let b of buildings) {
        if (Math.abs(nextX - b.x) < (b.w/2 + 3) && Math.abs(nextZ - b.z) < (b.d/2 + 3)) {
            collided = true;
            break;
        }
    }

    if (collided) {
        player.speed *= -0.5; // Bounce
        shakeIntensity = 10;
        state.lives--;
        createExplosion(player.x, player.z, COLORS.player);
        if (state.lives <= 0) gameOver();
    } else {
        player.x = nextX;
        player.z = nextZ;
    }

    // Update Mesh
    playerMesh.position.set(player.x, 1, player.z);
    playerMesh.rotation.y = player.angle;

    // Check Waypoints
    for (let i = waypoints.length - 1; i >= 0; i--) {
        const w = waypoints[i];
        const dist = Math.hypot(player.x - w.x, player.z - w.z);
        if (dist < 15) {
            state.score += 100;
            createExplosion(w.x, w.z, COLORS.waypoint);
            scene.remove(w.mesh);
            waypoints.splice(i, 1);
            spawnWaypoint(w.mesh.geometry, w.mesh.material);
        }
    }
}

function updateEnemies(dt) {
    enemies.forEach(e => {
        e.x += e.vx;
        e.z += e.vz;

        // Bounce off world bounds
        const limit = (GRID_SIZE * CELL_SIZE) / 2;
        if (Math.abs(e.x) > limit || Math.abs(e.z) > limit) {
            e.vx *= -1; e.vz *= -1;
        }

        // Bounce off buildings
        for (let b of buildings) {
            if (Math.abs(e.x - b.x) < (b.w/2 + 3) && Math.abs(e.z - b.z) < (b.d/2 + 3)) {
                e.vx *= -1; e.vz *= -1;
                e.x += e.vx * 2; e.z += e.vz * 2;
            }
        }

        e.mesh.position.set(e.x, 1, e.z);

        // Collision with Player
        const dist = Math.hypot(player.x - e.x, player.z - e.z);
        if (dist < 8) {
            state.lives--;
            shakeIntensity = 20;
            createExplosion(player.x, player.z, COLORS.enemy);
            if (state.lives <= 0) gameOver();
        }
    });
}

function createExplosion(x, z, color) {
    for(let i=0; i<15; i++) {
        const geo = new THREE.BoxGeometry(1, 1, 1);
        const mat = new THREE.MeshBasicMaterial({ color: color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, 1, z);
        scene.add(mesh);
        particles.push({
            mesh,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() * 2),
            vz: (Math.random() - 0.5) * 2,
            life: 1.0
        });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt * 2;
        p.mesh.position.x += p.vx;
        p.mesh.position.y += p.vy;
        p.mesh.position.z += p.vz;
        p.mesh.rotation.x += 0.1;
        p.mesh.scale.setScalar(p.life);
        
        if (p.life <= 0) {
            scene.remove(p.mesh);
            particles.splice(i, 1);
        }
    }
}

function updateCamera() {
    // Smooth follow
    const targetX = player.x;
    const targetZ = player.z + 80; // Offset
    const targetY = 120;

    camera.position.x += (targetX - camera.position.x) * 0.1;
    camera.position.z += (targetZ - camera.position.z) * 0.1;
    camera.position.y += (targetY - camera.position.y) * 0.1;
    
    camera.lookAt(player.x, 0, player.z);

    // Shake
    if (shakeIntensity > 0) {
        camera.position.x += (Math.random() - 0.5) * shakeIntensity * 0.1;
        camera.position.y += (Math.random() - 0.5) * shakeIntensity * 0.1;
        shakeIntensity *= 0.9;
        if (shakeIntensity < 0.5) shakeIntensity = 0;
    }
}

function updateHUD() {
    document.getElementById('scoreEl').innerText = `SCORE: ${state.score}`;
    document.getElementById('livesEl').innerText = `LIVES: ${state.lives}`;
    
    // Timer logic
    if (gameActive) {
        const now = Date.now();
        if (!window.startTime) window.startTime = now;
        const elapsed = (now - window.startTime) / 1000;
        const remaining = Math.max(0, 60 - elapsed);
        document.getElementById('timeEl').innerText = `TIME: ${remaining.toFixed(1)}`;
        
        if (remaining <= 0) gameOver();
    }
}

function gameOver() {
    gameActive = false;
    state.over = true;
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('statusText').innerText = `GAME OVER. Score: ${state.score}`;
    document.querySelector('.start-btn').innerText = "RETRY";
}

window.startGame = function() {
    document.getElementById('overlay').classList.add('hidden');
    window.startTime = Date.now();
    gameActive = true;
    state.reset();
};

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// Expose state
window.__game = state;

init();
</script>
</body>
</html>
