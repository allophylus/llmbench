<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA STRIKE</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#04060f;}
  #c{position:fixed;inset:0;display:block;}
  .hud{position:fixed;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;
       align-items:flex-start;pointer-events:none;font-family:ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace;color:#cfe6ff;z-index:5;}
  .brand{font-size:12px;letter-spacing:.34em;color:#5f7ba6;}
  .score{font-size:34px;font-weight:700;letter-spacing:.06em;color:#eaf6ff;text-shadow:0 0 18px rgba(90,200,255,.55);line-height:1;}
  .lives{font-size:22px;letter-spacing:.2em;color:#ff5d73;text-shadow:0 0 14px rgba(255,90,120,.5);}
  .hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;
        font-size:12px;letter-spacing:.22em;color:#5f7ba6;pointer-events:none;z-index:5;}
  .over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
        background:radial-gradient(circle at 50% 45%,rgba(10,16,34,.55),rgba(2,4,10,.85));z-index:6;
        font-family:ui-monospace,Menlo,Consolas,monospace;}
  .over h1{margin:0;font-size:64px;letter-spacing:.14em;color:#ff5d73;text-shadow:0 0 30px rgba(255,80,110,.6);}
  .over p{margin:0;font-size:16px;letter-spacing:.28em;color:#cfe6ff;}
</style>
<script type="importmap">
{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="brand">NOVA STRIKE</div>
  <div class="score" id="score">0</div>
  <div class="lives" id="lives">&#9679;&#9679;&#9679;</div>
</div>
<div class="hint">&larr; &rarr; / A D &nbsp;MOVE&nbsp;&nbsp;&nbsp; SPACE &nbsp;FIRE</div>
<div class="over" id="over"><h1>GAME OVER</h1><p>PRESS R TO RESTART</p></div>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060f);
scene.fog = new THREE.Fog(0x04060f, 40, 150);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 0, 0);

scene.add(new THREE.AmbientLight(0x334466, 0.9));
const key = new THREE.DirectionalLight(0x88bbff, 1.1); key.position.set(2, 4, 6); scene.add(key);
const rim = new THREE.PointLight(0xff5d73, 1.2, 60); rim.position.set(0, 2, 12); scene.add(rim);

// Starfield
const STAR_N = 700, starPos = new Float32Array(STAR_N * 3);
for (let i = 0; i < STAR_N; i++) {
  starPos[i*3] = (Math.random()*2-1)*40;
  starPos[i*3+1] = (Math.random()*2-1)*24;
  starPos[i*3+2] = -Math.random()*150;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xbfe0ff, size: 0.5, sizeAttenuation: true, transparent: true, opacity: 0.9 }));
scene.add(stars);

// Shared geometry / materials
const playerGeo = new THREE.ConeGeometry(0.7, 1.6, 4);
const playerMat = new THREE.MeshStandardMaterial({ color: 0x22d3ee, emissive: 0x0e7490, emissiveIntensity: 0.8, metalness: 0.3, roughness: 0.4 });
const bulletGeo = new THREE.BoxGeometry(0.22, 1.1, 0.22);
const bulletMat = new THREE.MeshStandardMaterial({ color: 0xfff2a8, emissive: 0xffd24a, emissiveIntensity: 1.6 });
const enemyGeo = new THREE.OctahedronGeometry(0.9, 0);
const enemyMats = [
  new THREE.MeshStandardMaterial({ color: 0xff5d73, emissive: 0x7a1020, emissiveIntensity: 0.7, metalness: 0.2, roughness: 0.5 }),
  new THREE.MeshStandardMaterial({ color: 0xffb020, emissive: 0x7a4a00, emissiveIntensity: 0.7, metalness: 0.2, roughness: 0.5 }),
  new THREE.MeshStandardMaterial({ color: 0x9d6bff, emissive: 0x3a1a7a, emissiveIntensity: 0.7, metalness: 0.2, roughness: 0.5 }),
];
const boomGeo = new THREE.SphereGeometry(0.5, 12, 12);
const boomMat = new THREE.MeshBasicMaterial({ color: 0xffd24a, transparent: true, opacity: 0.9 });

const player = new THREE.Mesh(playerGeo, playerMat);
player.rotation.x = Math.PI / 2;
player.position.set(0, -6, 10);
scene.add(player);

const bullets = [], enemies = [], booms = [];
const keys = {};
let score = 0, lives = 3, over = false, ready = false;
let fireCd = 0, spawnT = 0, shake = 0;
const MAX_ENEMIES = 12, PLAYER_X = 12, BULLET_SPEED = 55, STAR_SPEED = 22;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const overEl = document.getElementById('over');

function toScreen(v) {
  const p = v.clone().project(camera);
  return { x: (p.x * 0.5 + 0.5) * canvas.clientWidth, y: (-p.y * 0.5 + 0.5) * canvas.clientHeight };
}
function fire() {
  const b = new THREE.Mesh(bulletGeo, bulletMat);
  b.position.set(player.position.x, player.position.y + 1.2, player.position.z);
  scene.add(b); bullets.push(b);
}
function spawnEnemy() {
  const e = new THREE.Mesh(enemyGeo, enemyMats[(Math.random() * enemyMats.length) | 0]);
  e.position.set((Math.random()*2-1)*14, 10, -40 - Math.random()*20);
  e.userData.speed = 8 + Math.random()*10;
  e.userData.spin = (Math.random()*2-1)*2;
  scene.add(e); enemies.push(e);
}
function boom(pos) {
  const m = new THREE.Mesh(boomGeo, boomMat.clone());
  m.position.copy(pos); m.scale.setScalar(0.1); m.userData.life = 0;
  scene.add(m); booms.push(m);
}
function removeObj(arr, o) { const i = arr.indexOf(o); if (i >= 0) arr.splice(i, 1); scene.remove(o); }
function updateHUD() {
  scoreEl.textContent = score;
  livesEl.textContent = '\u25CF'.repeat(Math.max(0, lives)) + '\u25CB'.repeat(Math.max(0, 3 - lives));
  overEl.style.display = over ? 'flex' : 'none';
}
function reset() {
  while (bullets.length) removeObj(bullets, bullets[0]);
  while (enemies.length) removeObj(enemies, enemies[0]);
  while (booms.length) removeObj(booms, booms[0]);
  score = 0; lives = 3; over = false; fireCd = 0; spawnT = 0; shake = 0;
  player.position.set(0, -6, 10);
  updateHUD();
}

window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' ') e.preventDefault();
  keys[k] = true;
  if (k === 'r' || k === 'R') reset();
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  let dt = clock.getDelta();
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.05) dt = 0.05;

  const sp = starGeo.attributes.position.array;
  for (let i = 0; i < STAR_N; i++) {
    sp[i*3+2] += STAR_SPEED * dt;
    if (sp[i*3+2] > 20) { sp[i*3+2] = -150; sp[i*3] = (Math.random()*2-1)*40; sp[i*3+1] = (Math.random()*2-1)*24; }
  }
  starGeo.attributes.position.needsUpdate = true;

  if (!over) {
    let dir = 0;
    if (keys['ArrowLeft'] || keys['a']) dir -= 1;
    if (keys['ArrowRight'] || keys['d']) dir += 1;
    player.position.x += dir * 22 * dt;
    player.position.x = Math.max(-PLAYER_X, Math.min(PLAYER_X, player.position.x));
    player.rotation.z = -dir * 0.35;
    player.position.y = -6 + Math.sin(clock.elapsedTime * 3) * 0.15;

    fireCd -= dt;
    if (keys[' '] && fireCd <= 0) { fire(); fireCd = 0.18; }

    spawnT -= dt;
    if (spawnT <= 0 && enemies.length < MAX_ENEMIES) { spawnEnemy(); spawnT = 0.7 + Math.random()*0.8; }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i]; b.position.z -= BULLET_SPEED * dt;
      if (b.position.z < -160) removeObj(bullets, b);
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.position.z += e.userData.speed * dt;
      e.rotation.x += e.userData.spin * dt; e.rotation.y += e.userData.spin * 0.7 * dt;
      if (e.position.z > 14) { removeObj(enemies, e); continue; }
      let hit = false;
      for (let j = bullets.length - 1; j >= 0; j--) {
        if (e.position.distanceTo(bullets[j].position) < 1.4) {
          boom(e.position); removeObj(enemies, e); removeObj(bullets, bullets[j]);
          score += 10; hit = true; break;
        }
      }
      if (hit) continue;
      if (e.position.distanceTo(player.position) < 1.8) {
        boom(e.position); removeObj(enemies, e);
        lives--; shake = 0.5;
        if (lives <= 0) { lives = 0; over = true; }
      }
    }
  }

  for (let i = booms.length - 1; i >= 0; i--) {
    const m = booms[i]; m.userData.life += dt;
    const s = 0.1 + m.userData.life * 6;
    m.scale.setScalar(s); m.material.opacity = Math.max(0, 0.9 - m.userData.life * 1.8);
    if (m.userData.life > 0.5) removeObj(booms, m);
  }

  if (shake > 0) {
    shake -= dt;
    camera.position.x = (Math.random()*2-1) * shake * 0.6;
    camera.position.y = (Math.random()*2-1) * shake * 0.6;
  } else { camera.position.x = 0; camera.position.y = 0; }

  updateHUD();
  renderer.render(scene, camera);

  window.__game = {
    ready: true, score, lives, over,
    player: toScreen(player.position),
    enemies: enemies.map(e => toScreen(e.position)),
    bullets: bullets.map(b => toScreen(b.position)),
    reset
  };
  ready = true;
}
window.__game = { ready: false, score: 0, lives: 3, over: false, player: { x: 0, y: 0 }, enemies: [], bullets: [], reset };
updateHUD();
animate();
</script>
</body>
</html>
