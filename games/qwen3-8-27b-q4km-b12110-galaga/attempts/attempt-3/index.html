<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA STRIKE</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#04060f;}
  #c{position:fixed;inset:0;display:block;}
  .hud{position:fixed;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;
       align-items:flex-start;pointer-events:none;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
       color:#cfe6ff;text-shadow:0 0 10px rgba(80,180,255,.55);z-index:5;}
  .brand{font-size:12px;letter-spacing:4px;color:#7fd0ff;opacity:.85;}
  .score{font-size:34px;font-weight:700;letter-spacing:2px;line-height:1;}
  .lives{font-size:22px;letter-spacing:6px;margin-top:6px;color:#ff5d7a;}
  .hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-family:ui-monospace,monospace;
        font-size:12px;letter-spacing:2px;color:#5f7ba6;pointer-events:none;z-index:5;}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
        gap:14px;background:rgba(4,6,15,.55);backdrop-filter:blur(2px);z-index:6;
        font-family:ui-monospace,monospace;color:#fff;}
  #over h1{margin:0;font-size:64px;letter-spacing:8px;color:#ff4d6d;text-shadow:0 0 24px rgba(255,60,90,.7);}
  #over p{margin:0;font-size:16px;letter-spacing:3px;color:#9fd0ff;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div><div class="brand">NOVA STRIKE</div><div class="score" id="score">0</div></div>
  <div class="lives" id="lives">&#9679;&#9679;&#9679;</div>
</div>
<div class="hint">&larr; &rarr; / A D &nbsp;move &nbsp;&middot;&nbsp; SPACE &nbsp;fire &nbsp;&middot;&nbsp; R &nbsp;restart</div>
<div id="over"><h1>GAME OVER</h1><p>PRESS R TO RESTART</p></div>

<script type="importmap">
{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060f);
scene.fog = new THREE.Fog(0x04060f, 120, 320);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 0);

scene.add(new THREE.AmbientLight(0x334466, 1.2));
const key = new THREE.DirectionalLight(0x88bbff, 1.4); key.position.set(0, 10, 20); scene.add(key);
const rim = new THREE.PointLight(0xff5577, 1.2, 200); rim.position.set(0, 0, 40); scene.add(rim);

// Starfield
const STAR_N = 700, starGeo = new THREE.BufferGeometry(), starPos = new Float32Array(STAR_N * 3);
for (let i = 0; i < STAR_N; i++) {
  starPos[i*3] = (Math.random()*2-1)*120;
  starPos[i*3+1] = (Math.random()*2-1)*70;
  starPos[i*3+2] = -Math.random()*300;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xbfe0ff, size: 1.4, sizeAttenuation: true, transparent: true, opacity: 0.9 }));
scene.add(stars);

// Shared geometry / materials
const playerGeo = new THREE.ConeGeometry(1.4, 3.2, 4);
const playerMat = new THREE.MeshStandardMaterial({ color: 0x22d3ee, emissive: 0x0e7490, emissiveIntensity: 0.9, metalness: 0.4, roughness: 0.3 });
const bulletGeo = new THREE.BoxGeometry(0.5, 2.2, 0.5);
const bulletMat = new THREE.MeshStandardMaterial({ color: 0xfff2a8, emissive: 0xffcc33, emissiveIntensity: 1.6 });
const enemyGeo = new THREE.OctahedronGeometry(1.6, 0);
const enemyMats = [0xff3b6b, 0xff8a1e, 0xb14bff, 0x22e0a0].map(c => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.55, metalness: 0.3, roughness: 0.4 }));
const boomGeo = new THREE.SphereGeometry(1, 12, 12);
const boomMat = new THREE.MeshBasicMaterial({ color: 0xffb03a, transparent: true, opacity: 0.95 });

const player = new THREE.Mesh(playerGeo, playerMat);
player.rotation.x = Math.PI / 2;
player.position.set(0, -12, 10);
scene.add(player);

const PLAY_X = 42, PLAY_Z = 10, BULLET_Z = 10, ENEMY_SPAWN_Z = -150, ENEMY_CAP = 14;
const keys = {};
let score = 0, lives = 3, over = false, ready = false;
let bullets = [], enemies = [], booms = [];
let fireCd = 0, spawnT = 0, invuln = 0;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const overEl = document.getElementById('over');

function toScreen(v) {
  const p = v.clone().project(camera);
  return { x: (p.x * 0.5 + 0.5) * canvas.clientWidth, y: (-p.y * 0.5 + 0.5) * canvas.clientHeight };
}
function fire() {
  const b = new THREE.Mesh(bulletGeo, bulletMat);
  b.position.set(player.position.x, player.position.y, BULLET_Z);
  scene.add(b); bullets.push(b);
}
function spawnEnemy() {
  const e = new THREE.Mesh(enemyGeo, enemyMats[(Math.random() * enemyMats.length) | 0]);
  e.position.set((Math.random()*2-1)*PLAY_X, (Math.random()*2-1)*10, ENEMY_SPAWN_Z);
  e.userData.speed = 22 + Math.random() * 26;
  e.userData.spin = (Math.random()*2-1) * 2;
  scene.add(e); enemies.push(e);
}
function boom(pos) {
  const m = new THREE.Mesh(boomGeo, boomMat.clone());
  m.position.copy(pos); m.scale.setScalar(0.1); m.userData.life = 0.4;
  scene.add(m); booms.push(m);
}
function removeEnemy(e) { scene.remove(e); const i = enemies.indexOf(e); if (i >= 0) enemies.splice(i, 1); }
function removeBullet(b) { scene.remove(b); const i = bullets.indexOf(b); if (i >= 0) bullets.splice(i, 1); }
function removeBoom(m) { scene.remove(m); const i = booms.indexOf(m); if (i >= 0) booms.splice(i, 1); }

function reset() {
  bullets.forEach(removeBullet); enemies.forEach(removeEnemy); booms.forEach(removeBoom);
  score = 0; lives = 3; over = false; fireCd = 0; spawnT = 0; invuln = 0;
  player.position.set(0, -12, PLAY_Z);
  overEl.style.display = 'none';
  updateHud();
}
function updateHud() {
  scoreEl.textContent = String(score);
  livesEl.innerHTML = '&#9679;'.repeat(Math.max(0, lives)) + '&#9675;'.repeat(Math.max(0, 3 - lives));
  overEl.style.display = over ? 'flex' : 'none';
}

window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === ' ' || k === 'Spacebar') e.preventDefault();
  keys[k] = true;
  if ((k === 'r' || k === 'R') && over) reset();
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  let dt = clock.getDelta();
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.05) dt = 0.05;

  const sp = starGeo.attributes.position.array;
  for (let i = 0; i < STAR_N; i++) { sp[i*3+2] += 40 * dt; if (sp[i*3+2] > 20) sp[i*3+2] = -300; }
  starGeo.attributes.position.needsUpdate = true;

  if (!over) {
    const mv = 40 * dt;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.position.x -= mv;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.position.x += mv;
    player.position.x = Math.max(-PLAY_X, Math.min(PLAY_X, player.position.x));
    player.rotation.z = (keys['ArrowLeft'] || keys['a'] || keys['A']) ? 0.35 : (keys['ArrowRight'] || keys['d'] || keys['D']) ? -0.35 : 0;

    fireCd -= dt;
    if ((keys[' '] || keys['Spacebar']) && fireCd <= 0) { fire(); fireCd = 0.18; }

    spawnT -= dt;
    if (spawnT <= 0 && enemies.length < ENEMY_CAP) { spawnEnemy(); spawnT = 0.7 + Math.random() * 0.8; }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i]; b.position.z -= 130 * dt;
      if (b.position.z < -170) removeBullet(b);
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.position.z += e.userData.speed * dt;
      e.rotation.x += e.userData.spin * dt; e.rotation.y += e.userData.spin * 0.7 * dt;
      if (e.position.z > 25) { removeEnemy(e); continue; }
      for (let j = bullets.length - 1; j >= 0; j--) {
        if (e.position.distanceTo(bullets[j].position) < 2.6) {
          boom(e.position); removeEnemy(e); removeBullet(bullets[j]); score += 10; updateHud(); break;
        }
      }
    }
    if (invuln > 0) invuln -= dt;
    if (invuln <= 0) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        if (enemies[i].position.distanceTo(player.position) < 3.2) {
          boom(enemies[i].position); removeEnemy(enemies[i]); lives--; invuln = 1.2; updateHud();
          if (lives <= 0) { over = true; updateHud(); }
          break;
        }
      }
    }
  }
  for (let i = booms.length - 1; i >= 0; i--) {
    const m = booms[i]; m.userData.life -= dt; m.scale.setScalar(0.1 + (0.4 - m.userData.life) * 6);
    m.material.opacity = Math.max(0, m.userData.life / 0.4);
    if (m.userData.life <= 0) removeBoom(m);
  }

  renderer.render(scene, camera);

  window.__game = {
    ready: true, score, lives, over,
    player: toScreen(player.position),
    enemies: enemies.map(e => toScreen(e.position)),
    bullets: bullets.map(b => toScreen(b.position)),
    reset
  };
  ready = true;
}
window.__game = { ready: false, score: 0, lives: 3, over: false, player: { x: 0, y: 0 }, enemies: [], bullets: [], reset };
updateHud();
animate();
</script>
<script src="../../../../touch.js"></script>
</body>
</html>
