<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gravity Sandbox</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060f;font-family:ui-monospace,Menlo,Consolas,monospace;color:#eaf6ff;-webkit-user-select:none;user-select:none}
#hud{position:fixed;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
#hud h1{margin:0;font-size:15px;letter-spacing:3px;font-weight:700;color:#7fe0ff;text-shadow:0 0 12px rgba(127,224,255,.6)}
#hud .sub{font-size:11px;letter-spacing:1px;color:#8aa0c0;margin-top:3px}
#stats{text-align:right;font-size:12px;line-height:1.7}
#stats b{color:#ffd166;font-size:16px}
#stats .dim{color:#8aa0c0}
#msg{position:fixed;top:44%;left:0;right:0;text-align:center;font-size:26px;letter-spacing:4px;font-weight:700;color:#ff5d73;text-shadow:0 0 20px rgba(255,93,115,.7);opacity:0;transition:opacity .4s;pointer-events:none;z-index:6}
#msg.show{opacity:1}
#touch{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:14px;z-index:7;pointer-events:none}
#touch button{pointer-events:auto;touch-action:none;border:1px solid rgba(127,224,255,.5);background:rgba(20,30,55,.55);color:#cfeaff;border-radius:14px;font-family:inherit;font-size:13px;letter-spacing:1px;backdrop-filter:blur(4px)}
#launch{width:120px;height:120px;border-radius:50%;font-size:15px;font-weight:700}
#launch:active{background:rgba(127,224,255,.35)}
#reset{width:74px;height:44px}
</style>
</head>
<body>
<div id="hud">
  <div><h1>GRAVITY SANDBOX</h1><div class="sub">launch balls &middot; watch them settle</div></div>
  <div id="stats">
    <div>LAUNCHED <b id="s-launched">0</b> / 25</div>
    <div>ACTIVE <b id="s-active">0</b></div>
    <div class="dim">SETTLED <span id="s-settled">0</span></div>
  </div>
</div>
<div id="msg"></div>
<div id="touch">
  <button id="reset">RESET</button>
  <button id="launch">LAUNCH</button>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ---- deterministic RNG (mulberry32) ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry32(1337);

// ---- constants ----
const HALF=3, R=0.35, GRAV=-14, REST=0.72, FRICTION=0.985, AIR=0.999,
      SETTLE_V=0.12, SETTLE_T=0.5, MAXB=25, STEP=1/120, PALETTE=[0x7fe0ff,0xff5d73,0xffd166,0x9be7c0,0xb79bff];

// ---- scene ----
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0a0d1e,0.02);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// ---- lights ----
scene.add(new THREE.HemisphereLight(0x8fb8ff,0x1a1030,0.7));
const key=new THREE.DirectionalLight(0xffffff,1.1); key.position.set(5,8,4); scene.add(key);
const fill=new THREE.PointLight(0x7fe0ff,0.6,40); fill.position.set(-4,3,-3); scene.add(fill);

// ---- translucent box ----
const box=new THREE.Mesh(new THREE.BoxGeometry(HALF*2,HALF*2,HALF*2),
  new THREE.MeshPhysicalMaterial({color:0x2a3a66,transparent:true,opacity:0.12,roughness:0.1,metalness:0,side:THREE.DoubleSide,depthWrite:false}));
scene.add(box);
const edges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(HALF*2,HALF*2,HALF*2)),
  new THREE.LineBasicMaterial({color:0x7fe0ff,transparent:true,opacity:0.5}));
scene.add(edges);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(HALF*2,HALF*2),
  new THREE.MeshStandardMaterial({color:0x141a30,roughness:0.6,metalness:0.2,transparent:true,opacity:0.5}));
floor.rotation.x=-Math.PI/2; floor.position.y=-HALF; scene.add(floor);

// ---- balls ----
const ballGeo=new THREE.SphereGeometry(R,20,16);
const balls=[];
function makeBall(x,y,z,vx,vy,vz,color){
  const m=new THREE.MeshStandardMaterial({color,roughness:0.35,metalness:0.15,emissive:color,emissiveIntensity:0.15});
  const mesh=new THREE.Mesh(ballGeo,m); mesh.position.set(x,y,z); scene.add(mesh);
  const b={mesh,mat:m,vel:new THREE.Vector3(vx,vy,vz),flash:0,rest:0,settled:false};
  balls.push(b); return b;
}

// ---- particles ----
const PMAX=600, ppos=new Float32Array(PMAX*3), pcol=new Float32Array(PMAX*3),
      pvel=new Float32Array(PMAX*3), plife=new Float32Array(PMAX), pmax=new Float32Array(PMAX);
const pgeo=new THREE.BufferGeometry();
pgeo.setAttribute('position',new THREE.BufferAttribute(ppos,3));
pgeo.setAttribute('color',new THREE.BufferAttribute(pcol,3));
const pmat=new THREE.PointsMaterial({size:0.14,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
const points=new THREE.Points(pgeo,pmat); points.frustumCulled=false; scene.add(points);
let phead=0;
function burst(x,y,z,color,n){
  const c=new THREE.Color(color);
  for(let i=0;i<n;i++){
    const i3=phead*3; phead=(phead+1)%PMAX;
    ppos[i3]=x; ppos[i3+1]=y; ppos[i3+2]=z;
    const a=rng()*6.283, b=(rng()-0.5)*3.14, sp=1+rng()*3;
    pvel[i3]=Math.cos(a)*Math.cos(b)*sp; pvel[i3+1]=Math.sin(b)*sp+1; pvel[i3+2]=Math.sin(a)*Math.cos(b)*sp;
    pcol[i3]=c.r; pcol[i3+1]=c.g; pcol[i3+2]=c.b;
    plife[phead]=0; pmax[phead]=0.5+rng()*0.5;
  }
}
function updateParticles(dt){
  for(let i=0;i<PMAX;i++){
    if(plife[i]<=0) continue;
    plife[i]-=dt; const i3=i*3;
    if(plife[i]<=0){ ppos[i3+1]=9999; continue; }
    pvel[i3+1]+=GRAV*0.3*dt;
    ppos[i3]+=pvel[i3]*dt; ppos[i3+1]+=pvel[i3+1]*dt; ppos[i3+2]+=pvel[i3+2]*dt;
    const f=Math.max(plife[i]/pmax[i],0);
    pcol[i3]*=0.98; pcol[i3+1]*=0.98; pcol[i3+2]*=0.98;
  }
  pgeo.attributes.position.needsUpdate=true; pgeo.attributes.color.needsUpdate=true;
}

// ---- physics (fixed step, deterministic) ----
function collide(a,b){
  const dx=b.mesh.position.x-a.mesh.position.x, dy=b.mesh.position.y-a.mesh.position.y, dz=b.mesh.position.z-a.mesh.position.z;
  const d2=dx*dx+dy*dy+dz*dz, min=2*R;
  if(d2>=min*min||d2===0) return;
  const d=Math.sqrt(d2), nx=dx/d, ny=dy/d, nz=dz/d, ov=(min-d)/2;
  a.mesh.position.x-=nx*ov; a.mesh.position.y-=ny*ov; a.mesh.position.z-=nz*ov;
  b.mesh.position.x+=nx*ov; b.mesh.position.y+=ny*ov; b.mesh.position.z+=nz*ov;
  const rvx=b.vel.x-a.vel.x, rvy=b.vel.y-a.vel.y, rvz=b.vel.z-a.vel.z, vn=rvx*nx+rvy*ny+rvz*nz;
  if(vn<0){
    const j=-(1+REST)*vn/2;
    a.vel.x-=j*nx; a.vel.y-=j*ny; a.vel.z-=j*nz;
    b.vel.x+=j*nx; b.vel.y+=j*ny; b.vel.z+=j*nz;
    if(-vn>1.2){ a.flash=Math.max(a.flash,0.5); b.flash=Math.max(b.flash,0.5);
      burst((a.mesh.position.x+b.mesh.position.x)/2,(a.mesh.position.y+b.mesh.position.y)/2,(a.mesh.position.z+b.mesh.position.z)/2,PALETTE[(rng()*5)|0],10); }
  }
}
function physics(dt){
  for(const b of balls){
    if(b.settled) continue;
    b.vel.y+=GRAV*dt; b.vel.x*=AIR; b.vel.z*=AIR;
    b.mesh.position.addScaledVector(b.vel,dt);
    const p=b.mesh.position;
    if(p.y-R<-HALF){ p.y=-HALF+R; if(b.vel.y<0){ if(-b.vel.y>1.5){ b.flash=Math.max(b.flash,0.6); burst(p.x,p.y-R,p.z,b.mat.color,12); shake=Math.min(shake+0.15,0.6);} b.vel.y*=-REST; b.vel.x*=FRICTION; b.vel.z*=FRICTION; } }
    if(p.y+R>HALF){ p.y=HALF-R; if(b.vel.y>0) b.vel.y*=-REST; }
    if(p.x-R<-HALF){ p.x=-HALF+R; if(b.vel.x<0){ if(-b.vel.x>1.5){ b.flash=Math.max(b.flash,0.5); burst(p.x-R,p.y,p.z,b.mat.color,8);} b.vel.x*=-REST; } }
    if(p.x+R>HALF){ p.x=HALF-R; if(b.vel.x>0){ if(b.vel.x>1.5){ b.flash=Math.max(b.flash,0.5); burst(p.x+R,p.y,p.z,b.mat.color,8);} b.vel.x*=-REST; } }
    if(p.z-R<-HALF){ p.z=-HALF+R; if(b.vel.z<0){ if(-b.vel.z>1.5){ b.flash=Math.max(b.flash,0.5); burst(p.x,p.y,p.z-R,b.mat.color,8);} b.vel.z*=-REST; } }
    if(p.z+R>HALF){ p.z=HALF-R; if(b.vel.z>0){ if(b.vel.z>1.5){ b.flash=Math.max(b.flash,0.5); burst(p.x,p.y,p.z+R,b.mat.color,8);} b.vel.z*=-REST; } }
    if(b.vel.lengthSq()<SETTLE_V*SETTLE_V){ b.rest+=dt; if(b.rest>SETTLE_T) b.settled=true; } else b.rest=0;
  }
  for(let i=0;i<balls.length;i++) for(let j=i+1;j<balls.length;j++) collide(balls[i],balls[j]);
}

// ---- game state ----
let launched=0, over=false, shake=0, camT=0;
const keys={};
function launch(){
  if(over||launched>=MAXB) return;
  const x=(rng()*2-1)*(HALF-R-0.2), z=(rng()*2-1)*(HALF-R-0.2);
  const vx=(rng()*2-1)*3, vy=4+rng()*3, vz=(rng()*2-1)*3;
  const b=makeBall(x,HALF-R-0.1,z,vx,vy,vz,PALETTE[(rng()*5)|0]);
  b.flash=1; burst(x,HALF-R,z,b.mat.color,16); launched++;
  if(launched>=MAXB) endGame();
}
function endGame(){ over=true; msg('SANDBOX COMPLETE'); }
function reset(){
  for(const b of balls) scene.remove(b.mesh);
  balls.length=0; launched=0; over=false; shake=0;
  rng=mulberry32(1337); msg('');
}
function msg(t){ const m=document.getElementById('msg'); m.textContent=t; m.classList.toggle('show',!!t); }

// ---- input ----
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k]=true;
  if(k===' '||k==='enter') launch();
  if(k==='r') reset();
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
function bind(id,down,up){ const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();down();});
  el.addEventListener('pointerup',e=>{e.preventDefault();up&&up();});
  el.addEventListener('pointerleave',()=>up&&up());
}
bind('launch',launch,null);
bind('reset',reset,null);
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

// ---- HUD + machine state ----
const sL=document.getElementById('s-launched'), sA=document.getElementById('s-active'), sS=document.getElementById('s-settled');
window.__game={ready:true,score:0,lives:3,over:false,player:{x:0,y:0},enemies:[],bullets:[],reset};
function updateState(){
  const g=window.__game; g.over=over; g.score=launched; g.lives=MAXB-launched;
  g.player={x:0,y:0};
  g.bullets=balls.map(b=>({x:+b.mesh.position.x.toFixed(3),y:+b.mesh.position.y.toFixed(3)}));
  g.enemies=[];
  sL.textContent=launched;
  const act=balls.filter(b=>!b.settled).length;
  sA.textContent=act; sS.textContent=balls.length-act;
}

// ---- loop ----
let last=performance.now(), acc=0;
function animate(now){
  requestAnimationFrame(animate);
  let dt=(now-last)/1000; last=now; if(dt>0.1) dt=0.1;
  camT+=dt;
  if(!over){
    let ix=0,iz=0;
    if(keys['arrowleft']||keys['a']) ix-=1; if(keys['arrowright']||keys['d']) ix+=1;
    if(keys['arrowup']||keys['w']) iz-=1; if(keys['arrowdown']||keys['s']) iz+=1;
    const ang=camT*0.15+ix*0.6, rad=9.5, cy=Math.cos(ang), sy=Math.sin(ang);
    camera.position.set(cy*rad,4.2+iz*1.5,sy*rad);
  }
  camera.lookAt(0,0,0);
  acc+=dt; let n=0; while(acc>=STEP&&n<8){ physics(STEP); acc-=STEP; n++; }
  for(const b of balls){ if(b.flash>0){ b.flash-=dt*3; if(b.flash<0) b.flash=0; } b.mat.emissiveIntensity=0.15+b.flash*1.6; }
  updateParticles(dt);
  shake*=0.88;
  camera.position.x+=(Math.random()-0.5)*shake; camera.position.y+=(Math.random()-0.5)*shake;
  renderer.render(scene,camera);
  updateState();
}
requestAnimationFrame(animate);
</script>
</body>
</html>
